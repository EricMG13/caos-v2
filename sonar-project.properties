# The scanner CLI's configuration, read by the `sonarqube` CI job.
#
# Automatic analysis (SonarQube Cloud's own side) cannot import a coverage
# report, so an analysis that reads coverage.xml is a CI analysis, and a CI
# analysis reads this file.
#
# The identifiers below are not credentials. A project key is in every
# dashboard URL the check posts; the credential is SONAR_TOKEN, a repository
# secret, and appears nowhere in this tree.
sonar.projectKey=EricMG13_caos-v2
sonar.organization=ericmg13

# The fork's config lists `methodology` here too, but the scanner (unlike
# sonar.tests) errors on a directory that doesn't exist yet, and Phase 7 is
# what creates methodology/ (docs/DECISIONS.md 12 vendor addition). Add it
# back to this line -- not just to the tree -- when that phase lands.
#
# frontend/src, frontend/scripts and .github/workflows are listed explicitly
# because sonar.sources is the scanner's file-indexing boundary: a path
# outside it receives no analysis at all, from any language sensor, not a
# clean pass (SonarSource's own "Analysis scope" docs: "Files outside the
# scope ... will not be analyzed at all"). Automatic Analysis (which ignores
# this file) was the only thing scanning those paths before this job existed;
# once it is switched off in SonarCloud's Administration -> Analysis
# Method for this project, leaving them out would make frontend code and this
# workflow file go dark rather than clean. frontend/tests and frontend/fixtures
# stay out (test code and JSON fixtures); frontend/tests is a candidate for
# sonar.tests as a separate follow-up.
sonar.sources=scripts,server,frontend/src,frontend/scripts,.github/workflows
sonar.tests=tests
#
# Unset, SonarPython evaluates every rule against all of Python 3 at once.
# The repository is 3.14 only (requires-python in pyproject.toml).
sonar.python.version=3.14
#
# The Deploy V bundle (vendor/deploy-v/) is authority never edited -- a
# finding in it names something no pull request may fix. sonar.sources
# already leaves it out; this is the second lock, and the one that still
# holds if the source list ever widens.
sonar.exclusions=vendor/**
#
# Written by pytest (pyproject.toml [tool.coverage]) and handed to this job
# as an artifact, because the analysis runs in a job the tests do not.
sonar.python.coverage.reportPaths=coverage.xml
