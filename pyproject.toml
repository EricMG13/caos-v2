[project]
name = "caos"
version = "0.0.0"
description = "Governed source documents to committee-ready credit conclusions."
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv", "vendor", ".claude"]

[tool.ruff.lint]
# One rule family per measured failure mode in docs/AI_CODE_QUALITY.md section 1.
select = [
  "E", "F", "W",                        # baseline
  "I",                                  # import order
  "UP",                                 # pyupgrade
  "B",                                  # bugbear
  "ANN",                                # annotations -- typed refusals need typed code
  "BLE",                                # no blind except
  "TRY",                                # no str(exc) on the wire, no raise-vanilla
  "C901",                               # complexity ceiling
  "PLR0912", "PLR0913", "PLR0915",      # branch, argument, statement ceilings
  "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["^\\.venv/", "^vendor/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=xml --cov-report=term:skip-covered"

[tool.coverage.run]
branch = true
# One root, not the individual source directories: each `source` entry is a
# root Cobertura filenames are resolved against, and naming three of them
# writes the same "__init__.py" for each. The repo root keeps every filename
# repo-relative, which is what scan_floors.py and sonar.sources both expect.
source = ["."]
omit = ["tests/*", "vendor/*", ".venv*/*"]
